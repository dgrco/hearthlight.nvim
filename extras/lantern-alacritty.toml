# Mokka — Alacritty terminal theme
# Place in ~/.config/alacritty/themes/ and import with:
#   import:
#     - ~/.config/alacritty/themes/hearthlight.toml

[colors.primary]
background = "#1e1c18"
foreground = "#C8C093"
dim_foreground = "#6a5f50"
bright_foreground = "#DCD7BA"

[colors.cursor]
text   = "#1e1c18"
cursor = "#C8C093"

[colors.vi_mode_cursor]
text   = "#1e1c18"
cursor = "#8db49e"

[colors.search.matches]
foreground = "#1e1c18"
background = "#e5c07b"

[colors.search.focused_match]
foreground = "#1e1c18"
background = "#d19a5e"

[colors.hints.start]
foreground = "#1e1c18"
background = "#e5c07b"

[colors.hints.end]
foreground = "#1e1c18"
background = "#d19a5e"

[colors.selection]
text       = "#DCD7BA"
background = "#383530"

[colors.normal]
black   = "#1e1c18"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#82aacc"
magenta = "#c792d0"
cyan    = "#8db49e"
white   = "#C8C093"

[colors.bright]
black   = "#504d46"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#82aacc"
magenta = "#f0836e"
cyan    = "#8db49e"
white   = "#DCD7BA"

[colors.dim]
black   = "#25231e"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#e5c07b"
blue    = "#82aacc"
magenta = "#c792d0"
cyan    = "#8db49e"
white   = "#9e9170"
