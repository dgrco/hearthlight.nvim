# Mokka — Alacritty terminal theme
# Place in ~/.config/alacritty/themes/ and import with:
#   import:
#     - ~/.config/alacritty/themes/hearthlight.toml

[colors.primary]
background = "#110e0d"
foreground = "#C8C093"
dim_foreground = "#6a5248"
bright_foreground = "#DCD7BA"

[colors.cursor]
text   = "#110e0d"
cursor = "#C8C093"

[colors.vi_mode_cursor]
text   = "#110e0d"
cursor = "#8db49e"

[colors.search.matches]
foreground = "#110e0d"
background = "#ddc98a"

[colors.search.focused_match]
foreground = "#110e0d"
background = "#f6c177"

[colors.hints.start]
foreground = "#110e0d"
background = "#ddc98a"

[colors.hints.end]
foreground = "#110e0d"
background = "#f6c177"

[colors.selection]
text       = "#DCD7BA"
background = "#281e1b"

[colors.normal]
black   = "#110e0d"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#ddc98a"
blue    = "#82aacc"
magenta = "#c792d0"
cyan    = "#8db49e"
white   = "#C8C093"

[colors.bright]
black   = "#3d2e29"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#ddc98a"
blue    = "#82aacc"
magenta = "#f0836e"
cyan    = "#8db49e"
white   = "#DCD7BA"

[colors.dim]
black   = "#181210"
red     = "#e06c75"
green   = "#98c379"
yellow  = "#ddc98a"
blue    = "#82aacc"
magenta = "#c792d0"
cyan    = "#8db49e"
white   = "#9e8e7e"
