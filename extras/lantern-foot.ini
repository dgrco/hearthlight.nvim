regular5=c792d0
regular6=7ec8c8
regular7=C8C093

bright0=504d46
bright1=e06c75
bright2=98c379
bright3=e5c07b
bright4=82aacc
bright5=f0836e
bright6=7ec8c8
bright7=DCD7BA

# Dim colours (foot supports these natively)
dim0=25231e
dim1=e06c75
dim2=98c379
dim3=e5c07b
dim4=82aacc
dim5=c792d0
dim6=7ec8c8
dim7=9e9170

