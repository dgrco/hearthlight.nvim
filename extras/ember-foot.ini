# Mokka — foot terminal theme
# https://codeberg.org/dnkl/foot/wiki#themes
#
# Place in ~/.config/foot/themes/hearthlight and load with:
#   include=~/.config/foot/themes/hearthlight

[colors-dark]
background=110e0d
foreground=C8C093

selection-background=281e1b
selection-foreground=DCD7BA

cursor=110e0d C8C093

# 16-color palette
