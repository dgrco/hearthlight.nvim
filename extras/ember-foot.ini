regular1=e06c75
regular2=98c379
regular3=ddc98a
regular4=82aacc
regular5=c792d0
regular6=8db49e
regular7=C8C093

bright0=3d2e29
bright1=e06c75
bright2=98c379
bright3=ddc98a
bright4=82aacc
bright5=f0836e
bright6=8db49e
bright7=DCD7BA

# Dim colours (foot supports these natively)
dim0=181210
dim1=e06c75
dim2=98c379
dim3=ddc98a
dim4=82aacc
dim5=c792d0
dim6=8db49e
dim7=9e8e7e

urls=82aacc
